# Checks every push to main and dev, and every pull request.
#
# - Format: rustfmt (fast, no build needed).
# - Linux, Windows: clippy, tests, docs and a release build, plus the packaging
#   files. These are the supported platforms, so everything here must pass.
# - macOS: does it still compile? Not supported yet, so it reports without blocking.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # The same list as CONTRIBUTING.md; keep them in sync.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev \
            desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        # Runs without audio, a D-Bus session or a display: the app falls back to
        # ALSA and finds no player, which the tests expect. Snapshot rendering
        # needs a GPU and stays opt-in (it's #[ignore]d).
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Third-party licenses are up to date
        # Regenerate with: python3 packaging/third-party-licenses.py
        run: |
          python3 -I packaging/third-party-licenses.py
          git diff --exit-code packaging/THIRD-PARTY-LICENSES.txt

      - name: Install script
        run: |
          shellcheck install.sh
          stage=$(mktemp -d)
          DESTDIR="$stage" PREFIX=/usr ./install.sh
          for file in bin/undavi share/applications/undavi.desktop \
                      share/metainfo/undavi.metainfo.xml \
                      share/icons/hicolor/scalable/apps/undavi.svg \
                      share/licenses/undavi/LICENSE \
                      share/licenses/undavi/THIRD-PARTY-LICENSES.txt; do
            test -e "$stage/usr/$file" || { echo "missing: $file"; exit 1; }
          done

      - name: Desktop entry and AppStream metadata
        # The app ID isn't reverse-DNS yet (see docs/packaging.md); everything
        # else must validate.
        run: |
          desktop-file-validate packaging/linux/undavi.desktop
          appstreamcli validate --no-net \
            --override=cid-desktopapp-is-not-rdns=info \
            packaging/linux/undavi.metainfo.xml

      - uses: actions/upload-artifact@v4
        with:
          name: undavi-linux-x86_64
          path: target/release/undavi
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        # Runs without sound devices or a music player, like on Linux.
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Install script
        # In the Windows PowerShell that every Windows has, not the newer one.
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'a prefix'
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Undavi'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Prefix $prefix
          if ($LASTEXITCODE) { exit 1 }
          foreach ($file in 'bin\undavi.exe', 'install.ps1', 'licenses\LICENSE',
                            'licenses\THIRD-PARTY-LICENSES.txt') {
            if (-not (Test-Path "$prefix\$file")) { throw "missing: $file" }
          }
          if (-not (Test-Path $entry)) { throw 'not under Installed apps' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$prefix\install.ps1" -Uninstall -Prefix $prefix
          if ($LASTEXITCODE) { exit 1 }
          if ((Test-Path $prefix) -or (Test-Path $entry)) { throw 'uninstalling left something behind' }

      - name: Installer
        # Inno Setup comes with GitHub's Windows images.
        shell: powershell
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'another prefix'
          $entries = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          function Invoke-Quietly($program) {
            $options = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$prefix`""
            $p = Start-Process $program -ArgumentList $options -Wait -PassThru
            if ($p.ExitCode) { throw "$program failed with $($p.ExitCode)" }
          }
          $iscc = (Get-Item "${env:ProgramFiles}*\Inno Setup *\ISCC.exe")[-1].FullName
          & $iscc /Qp packaging\windows\undavi.iss
          if ($LASTEXITCODE) { exit 1 }
          $setup = (Get-Item target\installer\undavi-*-x86_64-windows-setup.exe).FullName
          # Over what install.ps1 installed, then over itself, like an update.
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Prefix $prefix
          if ($LASTEXITCODE) { exit 1 }
          Invoke-Quietly $setup
          Invoke-Quietly $setup
          foreach ($file in 'bin\undavi.exe', 'unins000.exe', 'licenses\LICENSE',
                            'licenses\THIRD-PARTY-LICENSES.txt') {
            if (-not (Test-Path "$prefix\$file")) { throw "missing: $file" }
          }
          if ((Get-ChildItem "$prefix\bin").Count -ne 1) { throw 'an old version was left behind' }
          if (Test-Path "$prefix\install.ps1") { throw 'both kinds of install at once' }
          if (-not (Test-Path "$entries\Undavi_is1")) { throw 'not under Installed apps' }
          if (Test-Path "$entries\Undavi") { throw 'under Installed apps twice' }
          # The script leaves it alone.
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Prefix $prefix 2>$null
          if (-not $LASTEXITCODE) { throw 'install.ps1 installed over it' }
          $ErrorActionPreference = 'Stop'
          Invoke-Quietly "$prefix\unins000.exe"
          if ((Test-Path "$prefix\bin") -or (Test-Path "$entries\Undavi_is1")) {
            throw 'uninstalling left something behind'
          }
          # (Not the exit code of the last program, which was meant to fail.)
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: undavi-windows-x86_64
          path: |
            target/release/undavi.exe
            target/installer/*.exe
          retention-days: 14

  other:
    name: macOS (compiles)
    runs-on: macos-latest
    # Not supported yet: report, but don't block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
