[package]
name = "undavi"
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.90"
description = "An audio visualizer for your desktop, with media art, playback controls and synced lyrics"
repository = "https://github.com/karsoncaliff/undavi"
license = "GPL-3.0-only"
readme = "README.md"
# Releases are built from this repository: a crates.io build would use the
# unpatched iced_wgpu (see vendor/iced_wgpu/PATCHED.md).
publish = false
keywords = [
    "music",
    "visualizer",
    "desktop",
    "app",
    "linux"
]
categories = ["visualization"]

[lib]
name = "undavi"
path = "src/lib.rs"

[[bin]]
name = "undavi"
path = "src/main.rs"
# The library's docs are the ones worth reading; this avoids a name clash in `cargo doc`.
doc = false

[dependencies]
cpal = "0.18.2"
realfft = "3.5.1"
ringbuf = "0.6.0"
iced = { version = "0.14.0", features = ["canvas", "svg", "image", "tokio", "advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3", features = ["json"] }
# The same version wgpu uses; checks custom background shaders before they reach
# the GPU (see src/shaders/mod.rs).
naga = { version = "27.0.3", features = ["wgsl-in"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1.0"
# The same version mpris uses; for the reduced-motion setting (see src/platform.rs).
dbus = "0.9"
cpal = { version = "0.18.2", features = ["pipewire"] }
# The same version cpal uses; for capturing single apps (see src/audio/linux.rs).
pipewire = "0.10.1"

[target.'cfg(windows)'.dependencies]
# The same version cpal uses; for the media controls (see src/media/windows.rs), capturing
# single apps (see src/audio/windows.rs) and a few other system calls.
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# What `windows::core::implement` expands to.
windows-core = "0.62.2"

# Puts the icon and version details into undavi.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"

# iced 0.14 can pick a float surface format on NVIDIA/Vulkan, which washes colors
# out; see vendor/iced_wgpu/PATCHED.md.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
